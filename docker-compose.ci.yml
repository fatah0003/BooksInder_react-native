services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booksinder_test
      MYSQL_USER: booksinder
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6.0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest

  backend:
    image: booksinder-backend:latest
    environment:
      APP_ENV: test
    env_file:
      - ./back/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
