stages:
  - build
  - test
  - validate

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/back/.composer-cache"

.docker_template:
  image: docker:24-cli
  services:
    - name: docker:24-dind          # ← FIX MTU pour Alpine apk
      command: ["--mtu=1300"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_CLIENT_TIMEOUT: 300
    COMPOSE_HTTP_TIMEOUT: 300
  before_script:
    - docker info
    - docker version
  tags:
    - docker

# STAGE 1 : BUILD (cache Docker + Composer)
build_backend:
  extends: .docker_template
  stage: build
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - back/.composer-cache/
  script:
    - echo "Construction image backend "
    - cd back
    # Cache Docker layers
    - docker pull booksinder-backend:latest || true
    - docker build 
        --cache-from booksinder-backend:latest
        --tag booksinder-backend:$CI_COMMIT_SHORT_SHA
        --tag booksinder-backend:latest .
    - echo "Image backend construite avec succes"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"

# STAGE 2 : TEST (healthchecks propres)
test_backend:
  extends: .docker_template
  stage: test
  timeout: 20m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
  - docker compose -f docker-compose.ci.yml up -d
  
  # Healthchecks
  - |
    for i in $(seq 1 30); do
      docker exec booksinder_mysql mysqladmin ping -h localhost -uroot -proot 2>/dev/null && break
      echo "MySQL $i/30..."
      sleep 2
    done
  - |
    for i in $(seq 1 30); do
      docker exec booksinder_mongodb mongosh --eval "db.adminCommand('ping')" 2>/dev/null && break
      echo "MongoDB $i/30..."
      sleep 2
    done

  # DEBUG : vérifie Symfony
  - docker exec booksinder_backend php bin/console about
  - docker exec booksinder_backend php bin/console list | grep doctrine

  # Doctrine : force sans interaction + allow empty
  - docker exec booksinder_backend php bin/console doctrine:database:create --if-not-exists --no-interaction
  - docker exec booksinder_backend php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

  # Tests
  - docker exec booksinder_backend php bin/phpunit --testdox

  - docker compose -f docker-compose.ci.yml down -v

  artifacts:
    when: always
    paths:
      - back/var/log/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"

# STAGE 3 : SMOKE TESTS
smoke_tests:
  extends: .docker_template
  stage: validate
  timeout: 15m
  script:
    - docker compose -f docker-compose.ci.yml up -d

    # Healthcheck MySQL rapide
    - |
      for i in $(seq 1 30); do
        docker exec booksinder_mysql mysqladmin ping -h localhost -uroot -proot 2>/dev/null && break
        sleep 2
      done

    # Tests rapides
    - docker exec booksinder_mysql mysql -uroot -proot -e "SHOW DATABASES;"
    - docker exec booksinder_mongodb mongosh --eval "db.adminCommand('ping')"
    - docker exec booksinder_backend php bin/console about
    
    - docker compose -f docker-compose.ci.yml down -v

  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
