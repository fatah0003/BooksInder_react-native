stages:
  - build
  - test
  - validate

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_CLIENT_TIMEOUT: "600"
  COMPOSE_HTTP_TIMEOUT: "600"

  # Isole les containers/réseaux par pipeline (évite conflits si un job timeout)
  COMPOSE_PROJECT_NAME: "booksinder_${CI_PIPELINE_ID}"

  # Tag de l'image backend à utiliser (celle buildée au stage build)
  BACKEND_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.docker_template:
  image: docker:28-cli
  before_script:
    - docker version
    - docker info
  tags:
    - booksinder-vm

# -------------------------
# STAGE 1 : BUILD
# -------------------------
build_backend:
  extends: .docker_template
  stage: build
  timeout: 45m
  script:
    - echo "Build backend image (CI)"
    - cd back
    # Build l'image CI (Dockerfile.ci) et tag avec le commit
    - docker build -f Dockerfile.ci
      --tag "booksinder-backend:${CI_COMMIT_SHORT_SHA}"
      --tag "booksinder-backend:latest"
      .
    - echo "OK image=booksinder-backend:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"

# -------------------------
# STAGE 2 : TEST
# -------------------------
test_backend:
  extends: .docker_template
  stage: test
  timeout: 45m
  needs:
    - job: build_backend
  script:
    # Démarre les services SANS build
    - docker compose -f docker-compose.ci.yml up -d --no-build
    - docker compose -f docker-compose.ci.yml ps

    # Attendre MySQL
    - |
      for i in $(seq 1 60); do
        docker compose -f docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost -uroot -proot >/dev/null 2>&1 && break
        echo "MySQL wait $i/60..."
        sleep 2
      done

    # Attendre Mongo
    - |
      for i in $(seq 1 60); do
        docker compose -f docker-compose.ci.yml exec -T mongodb mongosh --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
        echo "MongoDB wait $i/60..."
        sleep 2
      done

    # Sécurise la DB de test + droits (évite le 1044 access denied)
    - docker compose -f docker-compose.ci.yml exec -T mysql mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS booksinder_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    - docker compose -f docker-compose.ci.yml exec -T mysql mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON booksinder_test.* TO 'booksinder'@'%'; FLUSH PRIVILEGES;"

    # DEBUG Symfony
    - docker compose -f docker-compose.ci.yml exec -T backend php bin/console about
    - docker compose -f docker-compose.ci.yml exec -T backend php bin/console list | grep doctrine || true

    # Migrations + tests
    - docker compose -f docker-compose.ci.yml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test
    - docker compose -f docker-compose.ci.yml exec -T backend php bin/phpunit --testdox

    # Logs pour artifacts
    - mkdir -p artifacts/var-log
    - docker compose -f docker-compose.ci.yml cp backend:/var/www/html/var/log ./artifacts/var-log || true

  after_script:
    - docker compose -f docker-compose.ci.yml down -v --remove-orphans || true

  artifacts:
    when: always
    paths:
      - artifacts/var-log/
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"

# -------------------------
# STAGE 3 : SMOKE TESTS
# -------------------------
smoke_tests:
  extends: .docker_template
  stage: validate
  timeout: 20m
  needs:
    - job: build_backend
  script:
    - docker compose -f docker-compose.ci.yml up -d --no-build

    - docker compose -f docker-compose.ci.yml exec -T mysql \
        mysql -uroot -proot -e "SHOW DATABASES;"
    - docker compose -f docker-compose.ci.yml exec -T mongodb \
        mongosh --eval "db.adminCommand('ping')"
    - docker compose -f docker-compose.ci.yml exec -T backend \
        php bin/console about

  after_script:
    - docker compose -f docker-compose.ci.yml down -v --remove-orphans || true

  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
